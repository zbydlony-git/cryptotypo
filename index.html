:root{
  color-scheme:dark;
  --paper:#3232C8;      /* the CRYPTOTYPO square, full bleed */
  --ink:#FFFFFF;
  --violet:#3232C8;
  --mint:#32FAC8;       /* sampled from CT-1.gif */
  --muted:rgba(255,255,255,.78);
  --line:rgba(255,255,255,.38);
  --glyph:#32FAC8;
  --cta-bg:#32FAC8; --cta-fg:#3232C8; --cta-hover-bg:#FFFFFF; --cta-hover-fg:#3232C8;
  --f-display:"CT Display","Outfit","Futura","Century Gothic",system-ui,sans-serif;
  --f-text:"CT Text","Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --g:clamp(16px,3.6vw,56px);
  --type:min(16.4vw,30svh);
  --cap:.703;
  --ease:cubic-bezier(.22,.78,.16,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.hero{position:relative;height:100%;min-height:600px;overflow:hidden;isolation:isolate;
  background:radial-gradient(60% 55% at 78% 22%,rgba(50,250,200,.28),transparent 70%),radial-gradient(70% 60% at 30% 10%,#5a40f0 0,transparent 70%),radial-gradient(90% 80% at 20% 95%,#16136a 0,transparent 70%),var(--paper)}
.bg{position:absolute;inset:0;z-index:-1;width:100%;height:100%;display:block;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.bg.on{opacity:1}

/* ---------- header ---------- */
.top{position:absolute;z-index:10;inset:var(--g) var(--g) auto var(--g);display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:block;width:clamp(84px,7.6vw,124px);aspect-ratio:1;margin:0}
.logo img{display:block;width:100%;height:100%}
.arw{width:.95em;height:.95em;flex:none;transition:transform .45s var(--ease)}
a:hover .arw,a:focus-visible .arw{transform:translate(.18em,-.18em)}

/* ---------- giant type ---------- */
.type{position:absolute;left:var(--g);bottom:calc(var(--g) - .02*var(--type));margin:0;font:600 var(--type)/1 var(--f-display);letter-spacing:-.025em;white-space:nowrap;color:var(--ink);font-kerning:normal}
.line{position:relative;display:block;line-height:calc(var(--cap)*1em + .018em);height:calc(var(--cap)*1em + .018em);clip-path:inset(-.45em -.3em -.035em -.3em)}
.line.open{clip-path:none}
.l1{z-index:1}
.l2{z-index:3;margin-left:var(--indent,2.55em)}
.in{display:inline-block;transform:translateY(112%);animation:rise 1s var(--ease) forwards}
.l2 .in{animation-delay:.11s}
@keyframes rise{to{transform:none}}

/* ---------- 3D stage ---------- */
.stage{position:absolute;z-index:0;inset:0;pointer-events:none;opacity:0;scale:.96;animation:objIn 1s var(--ease) .5s forwards}
.stage-inner{position:absolute;inset:0;will-change:transform}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the still matches the live framing: object centred, 4.3 world units tall at unit = min(.425 H, .36 W) */
.stage img{position:absolute;display:block;left:var(--obj-cx,50%);top:var(--obj-cy,50%);translate:-50% -50%;height:var(--obj-h,min(182.75svh,154.8vw));width:auto;max-width:none}
.stage.live{z-index:5}
.stage.live img{visibility:hidden}
@keyframes objIn{to{opacity:1;scale:1}}

/* ---------- small elements ---------- */
.fade{opacity:0;translate:0 10px;animation:fadeUp .8s var(--ease) var(--d,.8s) forwards}
@keyframes fadeUp{to{opacity:1;translate:0 0}}

.cap{position:absolute;z-index:6;left:var(--g);top:calc(var(--g) + clamp(84px,7.6vw,124px) + clamp(28px,7svh,72px));margin:0;max-width:40ch;font:600 12px/1.45 var(--f-text);letter-spacing:.09em;text-transform:uppercase}
.cap span{color:var(--mint)}


.act{position:absolute;z-index:6;left:var(--g);bottom:var(--g);width:calc(var(--indent-px,40vw) - 3vw);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.cta{display:inline-flex;align-items:center;gap:.7em;padding:1.05em 1.5em 1.05em 1.6em;background:var(--cta-bg);color:var(--cta-fg);text-decoration:none;font:600 16px/1 var(--f-text);letter-spacing:.01em;border-radius:999px;transition:background-color .45s var(--ease),color .45s var(--ease)}
.cta .arw{width:1em;height:1em}
.cta:hover,.cta:focus-visible{background:var(--cta-hover-bg);color:var(--cta-hover-fg)}
.cta:focus-visible{outline-color:var(--violet)}
.mail{display:flex;align-items:center;gap:10px;font:500 13px/1.3 var(--f-text);color:var(--muted)}
.mail output{user-select:all}
.copy{font:600 11px/1 var(--f-text);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;transition:border-color .3s}
.copy:hover{border-color:var(--ink)}
.cta:focus-visible{outline-color:var(--ink)}

/* ---------- phone: vertical composition ---------- */
@media (max-width:760px){
  /* phone: the whole scene fits the visible screen (svh = height with browser bars shown);
     the 3D band takes whatever height is left, so the button is always on screen */
  :root{--type:min(calc((100vw - 2*var(--g)) / 5.12), 10.5svh)}
  .hero{height:100vh;height:100svh;min-height:0;display:flex;flex-direction:column;
    padding:calc(var(--g) + env(safe-area-inset-top,0px)) calc(var(--g) + env(safe-area-inset-right,0px)) calc(var(--g) + env(safe-area-inset-bottom,0px)) calc(var(--g) + env(safe-area-inset-left,0px))}
  .top{position:relative;inset:auto;flex:none}
  .logo{width:clamp(52px,10svh,84px)}
  .type{position:relative;left:auto;bottom:auto;flex:none;margin-top:clamp(10px,3.6svh,44px)}
  .stage-wrap{position:static;flex:1 1 0;min-height:0;margin-top:4px}
  .cap{position:relative;left:auto;top:auto;flex:none;max-width:none;margin-top:clamp(4px,1.4svh,14px);font-size:11px}
  .act{position:relative;left:auto;bottom:auto;flex:none;width:100%;margin-top:clamp(8px,1.8svh,16px);gap:clamp(6px,1.3svh,12px)}
  .cta{width:100%;justify-content:space-between;font-size:17px;padding:clamp(.8em,2svh,1.15em) 1.4em}
}
@media (max-width:760px) and (max-height:560px){ .mail{font-size:12px} .copy{padding:4px 9px} }
@media (min-width:761px){ .stage-wrap{display:contents} }
@media (min-width:761px) and (max-height:620px){ :root{--type:min(15vw,27svh)} .cap{display:none} }

@media (prefers-reduced-motion:reduce){
  .in{transform:none;animation:none}
  .line{clip-path:none}
  .stage{scale:1;animation:fadeOnly .4s ease forwards}
  .fade{translate:0 0;animation:fadeOnly .4s ease forwards}
  .arw,.cta{transition:none}
  @keyframes fadeOnly{to{opacity:1}}
}
</style>
</head>

(() => {
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const qs = location.search;
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  const isDark = () => false;
  const STILL_FLAG = /[?&]still\b/.test(qs);

  /* ---------- shared-T offset, measured from the real glyphs ---------- */
  const hero = document.querySelector('.hero');
  const type = document.querySelector('.type');
  const l1in = type.querySelector('.l1 .in');
  function layoutType(){
    const node = l1in.firstChild; if(!node) return;
    const r = document.createRange(); r.setStart(node,4); r.setEnd(node,5);
    const tx = r.getBoundingClientRect().left - l1in.getBoundingClientRect().left;
    const fs = parseFloat(getComputedStyle(type).fontSize) || 1;
    type.style.setProperty('--indent', (tx/fs).toFixed(4)+'em');
    hero.style.setProperty('--indent-px', tx+'px');
  }
  fontsReady.then(layoutType); layoutType();
  addEventListener('resize', layoutType);
  type.querySelectorAll('.in').forEach(el => el.addEventListener('animationend', e => { if (e.target === el) el.parentNode.classList.add('open'); }));
  if (reduce) type.querySelectorAll('.line').forEach(l => l.classList.add('open'));

  /* ---------- the glass Y turns over into the figure now and then ---------- */
  const motion = { angle: 0, moving: false };      // shared with the 3D scene
  const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
  const CYCLE = 9.6, START = 2.3;
  let tStart = null;
  function letters(now){
    if (tStart === null) tStart = now;
    const t = (now - tStart)/1000 - START;
    let a = 0;
    if (t > 0){
      const c = t % CYCLE;
      if (c < .35) a = 0;
      else if (c < 1.75) a = Math.PI * ease((c - .35)/1.4);
      else if (c < 4.0) a = Math.PI;
      else if (c < 5.4) a = Math.PI + Math.PI * ease((c - 4.0)/1.4);
      else a = 0;
      if (a >= 2*Math.PI - 1e-4) a = 0;
    }
    motion.moving = Math.abs(a - motion.angle) > 1e-4;
    motion.angle = a;
    requestAnimationFrame(letters);
  }
  if (!reduce) requestAnimationFrame(letters);  // drives the 3D figure only

  /* ---------- copy address ---------- */
  const copyBtn = document.getElementById('copy'), live = document.getElementById('live'), addr = document.getElementById('addr');
  copyBtn.addEventListener('click', () => {
    const done = () => { copyBtn.textContent = 'Copied'; live.textContent = 'Address copied'; setTimeout(() => { copyBtn.textContent = 'Copy'; live.textContent=''; }, 1800); };
    const select = () => { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(addr); s.removeAllRanges(); s.addRange(rg); copyBtn.textContent='Selected'; setTimeout(()=>copyBtn.textContent='Copy',2200); };
    try { navigator.clipboard.writeText(addr.textContent).then(done, select); } catch(e){ select(); }
  });

  /* ---------- animated brand gradient (WebGL; CSS gradient underneath as fallback) ---------- */
  const shared = { t0: performance.now(), bgT: 0, calmA: [0,0,0,0], calmB: [0,0,0,0] };
  const actEl = document.querySelector('.act');
  function calm(){
    const hr = hero.getBoundingClientRect();
    const box = el => { const r = el.getBoundingClientRect(); return [(r.left-hr.left)/hr.width, (r.top-hr.top)/hr.height, (r.right-hr.left)/hr.width, (r.bottom-hr.top)/hr.height]; };
    shared.calmA = box(type); shared.calmB = box(actEl);
  }
  fontsReady.then(calm); calm(); addEventListener('resize', calm);
  (() => {
    const cv = document.getElementById('bg');
    const g = cv.getContext('webgl', {alpha:false, antialias:false, depth:false, powerPreference:'low-power'});
    if (!g) return;
    const BG_FS = `precision highp float;\nuniform vec2 uView;\nuniform vec2 uRes;\n// ---- shared brand gradient (background canvas + what the glass refracts) ----\nuniform float uBgT;\nuniform vec4 uCalmA;   // headline box, 0..1 of the hero (x0, y0, x1, y1), y down\nuniform vec4 uCalmB;   // call-to-action box\nconst vec3 BG_DEEP = vec3(0.075, 0.07, 0.40);\nconst vec3 BG_BLUE = vec3(0.196, 0.196, 0.784);\nconst vec3 BG_ELEC = vec3(0.44, 0.30, 1.0);\nconst vec3 BG_MINT = vec3(0.196, 0.98, 0.784);\n\nfloat bgHash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }\nfloat bgNoise(vec2 p){\n  vec2 i = floor(p), f = fract(p);\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(bgHash(i), bgHash(i + vec2(1.0, 0.0)), u.x), mix(bgHash(i + vec2(0.0, 1.0)), bgHash(i + vec2(1.0, 1.0)), u.x), u.y);\n}\nfloat bgFbm(vec2 p){\n  float v = 0.0, a = 0.5;\n  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);\n  for (int i = 0; i < 4; i++){ v += a * bgNoise(p); p = m * p; a *= 0.5; }\n  return v;\n}\nfloat calmBox(vec2 uv, vec4 b){\n  vec2 c = 0.5 * (b.xy + b.zw), h = 0.5 * (b.zw - b.xy);\n  vec2 d = abs(uv - c) - h;\n  float dist = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);\n  return 1.0 - smoothstep(-0.02, 0.16, dist);\n}\nvec3 blob(vec3 col, vec2 p, vec2 c, float r, vec3 tint, float a){\n  vec2 d = p - c;\n  return mix(col, tint, a * exp(-dot(d, d) / (r * r)));\n}\nvec3 bgColor(vec2 uv){\n  float t = uBgT;\n  float asp = uView.x / uView.y;\n  vec2 p = vec2(uv.x * asp, uv.y);\n  // a low-frequency warp keeps the blobs organic; everything drifts on 15–40 s loops\n  p += 0.09 * vec2(sin(p.y * 2.1 + t * 0.42), cos(p.x * 1.7 - t * 0.36));\n  float calm = max(calmBox(uv, uCalmA), calmBox(uv, uCalmB));\n  vec3 col = BG_BLUE;\n  col = blob(col, p, vec2(0.14 * asp + 0.16 * sin(t * 0.23), 0.92 + 0.10 * cos(t * 0.29)), 0.62, BG_DEEP, 0.9);\n  col = blob(col, p, vec2(0.38 * asp + 0.24 * sin(t * 0.19 + 1.0), 0.14 + 0.14 * sin(t * 0.26)), 0.5, BG_ELEC, 0.78);\n  col = blob(col, p, vec2(0.9 * asp + 0.14 * cos(t * 0.21), 0.92 + 0.10 * sin(t * 0.17)), 0.5, vec3(0.06, 0.32, 0.92), 0.8);\n  col = blob(col, p, vec2(0.64 * asp + 0.26 * sin(t * 0.16 + 2.0), 0.56 + 0.18 * cos(t * 0.22 + 1.0)), 0.42, vec3(0.55, 0.52, 1.0), 0.5 * (1.0 - 0.6 * calm));\n  col = blob(col, p, vec2(0.84 * asp + 0.2 * sin(t * 0.27 + 0.5), 0.22 + 0.18 * cos(t * 0.24 + 2.2)), 0.38, BG_MINT, 0.85 * (1.0 - calm));\n  col = blob(col, p, vec2(0.08 * asp + 0.1 * cos(t * 0.2), 0.08 + 0.08 * sin(t * 0.3)), 0.4, BG_DEEP, 0.55);\n  col = mix(col, mix(BG_BLUE, BG_DEEP, 0.25), calm * 0.25);\n  return col;\n}\n\nvoid main(){ vec2 uv = vec2(gl_FragCoord.x / uRes.x, 1.0 - gl_FragCoord.y / uRes.y); vec3 c = bgColor(uv); c += (bgHash(gl_FragCoord.xy + fract(uBgT)) - 0.5) / 160.0; gl_FragColor = vec4(c, 1.0); }`;
    try {
      const sh = (t,src) => { const o = g.createShader(t); g.shaderSource(o,src); g.compileShader(o); if (!g.getShaderParameter(o,g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(o)); return o; };
      const pr = g.createProgram(); g.attachShader(pr, sh(g.VERTEX_SHADER,`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`)); g.attachShader(pr, sh(g.FRAGMENT_SHADER,BG_FS)); g.linkProgram(pr);
      if (!g.getProgramParameter(pr, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(pr));
      g.useProgram(pr);
      const bf = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER,bf); g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
      const l = g.getAttribLocation(pr,'p'); g.enableVertexAttribArray(l); g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);
      const u = {}; ['uView','uRes','uBgT','uCalmA','uCalmB'].forEach(k => u[k] = g.getUniformLocation(pr,k));
      const still = reduce || STILL_FLAG;
      let w = 0, h = 0, lastDraw = 0;
      const draw = now => {
        const hr = hero.getBoundingClientRect(), s = Math.min(devicePixelRatio || 1, 1) * .5;
        const nw = Math.max(2, Math.round(hr.width*s)), nh = Math.max(2, Math.round(hr.height*s));
        if (nw !== w || nh !== h){ w = cv.width = nw; h = cv.height = nh; g.viewport(0,0,w,h); }
        shared.bgT = still ? 3.0 : 3.0 + (now - shared.t0)/1000;
        g.uniform2f(u.uView, hr.width, hr.height); g.uniform2f(u.uRes, w, h); g.uniform1f(u.uBgT, shared.bgT);
        g.uniform4fv(u.uCalmA, shared.calmA); g.uniform4fv(u.uCalmB, shared.calmB);
        g.drawArrays(g.TRIANGLES,0,3);
        cv.classList.add('on');
      };
      if (still){ fontsReady.then(() => { calm(); draw(performance.now()); }); addEventListener('resize', () => draw(performance.now())); return; }
      const loop = now => { if (now - lastDraw > 30){ lastDraw = now; draw(now); } requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    } catch(e){ console.warn('gradient unavailable', e); }
  })();

  /* ---------- 3D glass OY ---------- */
  const stage = document.getElementById('stage'), inner = document.getElementById('stageInner');
  const wrap = document.querySelector('.stage-wrap');
  // where the figure sits, in CSS px of the hero: desktop — centred, large, cropped by the viewport;
  // phone — the whole OY fitted inside the band between the headline and the button
  const frameObj = { unit: 1, cx: 0, cy: 0 };
  function frameGeom(){
    const hr = hero.getBoundingClientRect();
    if (innerWidth <= 760){
      const wr = wrap.getBoundingClientRect();
      frameObj.unit = Math.min(wr.height/4.4, wr.width/2.3);
      frameObj.cx = wr.left + wr.width/2 - hr.left; frameObj.cy = wr.top + wr.height/2 - hr.top;
    } else {
      frameObj.unit = Math.min(hr.height*.425, hr.width*.36);
      frameObj.cx = hr.width/2; frameObj.cy = hr.height/2;
    }
    stage.style.setProperty('--obj-cx', frameObj.cx+'px'); stage.style.setProperty('--obj-cy', frameObj.cy+'px');
    stage.style.setProperty('--obj-h', (4.3*frameObj.unit)+'px');
  }
  frameGeom(); fontsReady.then(frameGeom); addEventListener('resize', frameGeom);
  const STILL_ONLY = STILL_FLAG;
  const FORCE = /[?&]3d\b/.test(qs);
  const lowEnd = !FORCE && ((navigator.deviceMemory && navigator.deviceMemory < 3) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 3) || (navigator.connection && navigator.connection.saveData));
  if ((reduce || lowEnd) && !STILL_ONLY) return;

  const VS = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const FS = `precision highp float;
uniform vec2 uRes;
uniform vec2 uCenter;
uniform float uUnit;
uniform mat3 uRot;
uniform mat3 uRotI;
uniform float uLift;
uniform float uTime;
uniform vec4 uRect;
uniform vec2 uView;
uniform sampler2D uMask;
uniform float uWeave;
uniform float uText;
uniform float uFlip;
uniform float uDark;
uniform vec3 uPaper;
uniform vec3 uInk;
// ---- shared brand gradient (background canvas + what the glass refracts) ----
uniform float uBgT;
uniform vec4 uCalmA;   // headline box, 0..1 of the hero (x0, y0, x1, y1), y down
uniform vec4 uCalmB;   // call-to-action box
const vec3 BG_DEEP = vec3(0.075, 0.07, 0.40);
const vec3 BG_BLUE = vec3(0.196, 0.196, 0.784);
const vec3 BG_ELEC = vec3(0.44, 0.30, 1.0);
const vec3 BG_MINT = vec3(0.196, 0.98, 0.784);

float bgHash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float bgNoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(bgHash(i), bgHash(i + vec2(1.0, 0.0)), u.x), mix(bgHash(i + vec2(0.0, 1.0)), bgHash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float bgFbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++){ v += a * bgNoise(p); p = m * p; a *= 0.5; }
  return v;
}
float calmBox(vec2 uv, vec4 b){
  vec2 c = 0.5 * (b.xy + b.zw), h = 0.5 * (b.zw - b.xy);
  vec2 d = abs(uv - c) - h;
  float dist = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
  return 1.0 - smoothstep(-0.02, 0.16, dist);
}
vec3 blob(vec3 col, vec2 p, vec2 c, float r, vec3 tint, float a){
  vec2 d = p - c;
  return mix(col, tint, a * exp(-dot(d, d) / (r * r)));
}
vec3 bgColor(vec2 uv){
  float t = uBgT;
  float asp = uView.x / uView.y;
  vec2 p = vec2(uv.x * asp, uv.y);
  // a low-frequency warp keeps the blobs organic; everything drifts on 15–40 s loops
  p += 0.09 * vec2(sin(p.y * 2.1 + t * 0.42), cos(p.x * 1.7 - t * 0.36));
  float calm = max(calmBox(uv, uCalmA), calmBox(uv, uCalmB));
  vec3 col = BG_BLUE;
  col = blob(col, p, vec2(0.14 * asp + 0.16 * sin(t * 0.23), 0.92 + 0.10 * cos(t * 0.29)), 0.62, BG_DEEP, 0.9);
  col = blob(col, p, vec2(0.38 * asp + 0.24 * sin(t * 0.19 + 1.0), 0.14 + 0.14 * sin(t * 0.26)), 0.5, BG_ELEC, 0.78);
  col = blob(col, p, vec2(0.9 * asp + 0.14 * cos(t * 0.21), 0.92 + 0.10 * sin(t * 0.17)), 0.5, vec3(0.06, 0.32, 0.92), 0.8);
  col = blob(col, p, vec2(0.64 * asp + 0.26 * sin(t * 0.16 + 2.0), 0.56 + 0.18 * cos(t * 0.22 + 1.0)), 0.42, vec3(0.55, 0.52, 1.0), 0.5 * (1.0 - 0.6 * calm));
  col = blob(col, p, vec2(0.84 * asp + 0.2 * sin(t * 0.27 + 0.5), 0.22 + 0.18 * cos(t * 0.24 + 2.2)), 0.38, BG_MINT, 0.85 * (1.0 - calm));
  col = blob(col, p, vec2(0.08 * asp + 0.1 * cos(t * 0.2), 0.08 + 0.08 * sin(t * 0.3)), 0.4, BG_DEEP, 0.55);
  col = mix(col, mix(BG_BLUE, BG_DEEP, 0.25), calm * 0.25);
  return col;
}

const float D = 9.0;
const float RB = 2.3;
const vec3 VIO = vec3(0.196, 0.196, 0.784);
const vec3 MINT = vec3(0.196, 0.980, 0.784);
const float YO = 0.935;     // O centre
const float YY = -1.03;     // Y centre
const float DZ = 0.25;      // half depth of the extrusion

float sdRBox2(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float sdRBox(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
float smax(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return max(a, b) + h * h * k * 0.25; }

vec3 yLocal(vec3 p){
  // the Y turns over around its own horizontal axis (same move as the letter in TYPO)
  vec3 l = p - vec3(0.0, YY, 0.0);
  float c = cos(uFlip), s = sin(uFlip);
  return vec3(l.x, c * l.y + s * l.z, -s * l.y + c * l.z);
}

float sdO(vec3 p){
  vec3 q = p - vec3(0.0, YO, 0.0);
  return sdRBox2(vec2(length(q.xy) - 0.764, q.z), vec2(0.236, DZ), 0.075);
}
float sdY(vec3 p){
  vec3 l = yLocal(p);
  float stem = sdRBox(l - vec3(0.0, -0.45, 0.0), vec3(0.2, 0.455, DZ), 0.075);
  vec2 J = vec2(0.0, -0.05), A = vec2(0.86, 1.155);
  vec2 dir = normalize(A - J), mid = 0.5 * (A + J);
  vec2 lp = vec2(abs(l.x), l.y) - mid;
  vec2 u = vec2(dot(lp, dir), dot(lp, vec2(-dir.y, dir.x)));
  float arm = sdRBox(vec3(u, l.z), vec3(0.5 * length(A - J), 0.2, DZ), 0.075);
  float d = min(stem, arm);
  d = smax(d, l.y - 0.905, 0.1);   // flat-cut terminals, softly bevelled
  return d;
}
float map(vec3 p){ return min(sdO(p), sdY(p)); }

vec3 calcNormal(vec3 p){
  const vec2 e = vec2(1.0, -1.0) * 0.0012;
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

vec3 pal(float x){
  vec3 W = vec3(0.95, 0.94, 1.0);
  float s = fract(x) * 4.0;
  if (s < 1.0) return mix(VIO, W, smoothstep(0.0, 1.0, s));
  if (s < 2.0) return mix(W, MINT, smoothstep(1.0, 2.0, s));
  if (s < 3.0) return mix(MINT, W, smoothstep(2.0, 3.0, s));
  return mix(W, VIO, smoothstep(3.0, 4.0, s));
}

// Studio surround seen in reflections: softbox above, violet panel left, mint panel right, strip lights.
vec3 env(vec3 d){
  vec3 lo = mix(vec3(0.10, 0.10, 0.17), vec3(0.015, 0.015, 0.03), uDark);
  vec3 hi = mix(vec3(0.97, 0.97, 0.995), vec3(0.24, 0.24, 0.32), uDark);
  vec3 c = mix(lo, hi, smoothstep(-0.55, 0.55, d.y));
  float top = smoothstep(0.62, 0.9, d.y) * smoothstep(0.85, 0.3, abs(d.x));
  c += vec3(1.0) * top * mix(0.6, 1.1, uDark);
  float vp = smoothstep(0.2, 0.7, -d.x) * smoothstep(0.7, 0.05, abs(d.y - 0.05));
  c = mix(c, VIO * mix(1.0, 1.15, uDark), vp * 0.9);
  float mp = smoothstep(0.3, 0.75, d.x) * smoothstep(0.65, 0.05, abs(d.y + 0.15));
  c = mix(c, MINT * mix(1.0, 0.9, uDark), mp * 0.85);
  float strip = smoothstep(0.035, 0.0, abs(abs(d.x) - 0.62)) * smoothstep(0.75, 0.2, abs(d.y - 0.1));
  c += vec3(1.0) * strip * 0.9;
  // a soft diagonal window in front: the sheen that slides across the flat faces as the glass turns
  float win = smoothstep(0.16, 0.0, abs(d.x * 0.8 + d.y * 0.6 - 0.22)) * smoothstep(-0.2, 0.5, d.z);
  c += vec3(1.0) * win * mix(1.4, 1.8, uDark);
  return c;
}

// What the glass sees behind it: the page itself, with the giant letters.
vec3 behind(vec3 P, vec3 Dw){
  if (Dw.z > -0.06) return env(Dw);
  float s = (-0.7 - P.z) / Dw.z;
  vec3 H = P + Dw * s;
  vec2 uv = H.xy * D / (D - H.z);
  vec2 px = uCenter + uv * uUnit;
  vec2 sc = uRect.xy + vec2(px.x / uRes.x, 1.0 - px.y / uRes.y) * uRect.zw;
  float m = texture2D(uMask, sc / uView).a * uText;
  return mix(uText < 0.5 ? uPaper : bgColor(sc / uView), uInk, m);
}

vec3 shade(vec3 po, vec3 ord, vec3 rd){
  vec3 no = calcNormal(po);
  vec3 n = uRot * no;
  float ndv = clamp(dot(n, -rd), 0.0, 1.0);
  float F = 0.06 + 0.94 * pow(1.0 - ndv, 5.0);

  // reflection with a faint violet / mint film
  vec3 refl = env(reflect(rd, n));
  refl *= mix(vec3(1.0), pal(ndv * 1.3 + n.y * 0.2 + uTime * 0.02), 0.4);

  // refraction: through the body, out the back, onto the page (per-channel for dispersion)
  vec3 r1 = refract(ord, no, 1.0 / 1.46);
  vec3 p = po - no * 0.006;
  float ti = 0.0;
  for (int i = 0; i < 56; i++){
    float d = -map(p + r1 * ti);
    if (d < 0.0015) break;
    ti += max(d, 0.012);
  }
  vec3 p2 = p + r1 * ti;
  vec3 n2 = calcNormal(p2);
  vec3 P2 = uRot * p2 + vec3(0.0, uLift, 0.0);
  vec3 tr;
  vec3 eR = refract(r1, -n2, 1.42), eG = refract(r1, -n2, 1.46), eB = refract(r1, -n2, 1.51);
  vec3 tir = env(uRot * reflect(r1, -n2));
  tr.r = dot(eR, eR) < 1e-4 ? tir.r : behind(P2, uRot * eR).r;
  tr.g = dot(eG, eG) < 1e-4 ? tir.g : behind(P2, uRot * eG).g;
  tr.b = dot(eB, eB) < 1e-4 ? tir.b : behind(P2, uRot * eB).b;

  // violet glass: red/green absorbed with path length, a touch of mint glow at the thick parts
  vec3 absorb = vec3(1.25, 0.12, 0.42) * 0.3;   // faint mint glass on the brand blue
  vec3 T = exp(-absorb * ti);
  vec3 col = tr * T + MINT * 0.05 * smoothstep(0.3, 0.9, ti) * (1.0 - T.g);
  col += VIO * uDark * 0.55 * (1.0 - T.r) + tir * 0.12;

  col = mix(col, refl, F);
  vec3 L = normalize(vec3(-0.55, 0.8, 0.5));
  float nh = max(dot(n, normalize(L - rd)), 0.0);
  col += vec3(1.0) * pow(nh, 220.0) * 1.1;
  col += mix(VIO, MINT, smoothstep(-0.3, 0.3, n.x)) * pow(1.0 - ndv, 3.0) * 0.35 * uDark;
  return col;
}

vec3 skeleton(vec3 po){
  if (sdO(po) < sdY(po)) return vec3(po.xy, 0.0);
  vec3 l = yLocal(po); l.z = 0.0;
  float c = cos(uFlip), s = sin(uFlip);
